# ================================================================
#  expense-service  Port 8082
#  Handles: add/edit/delete expenses, filter, search, totals
# ================================================================

server.port=8082
spring.application.name=expense-service

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CHANGE THIS: use your MySQL password
spring.datasource.url=jdbc:mysql://localhost:3306/spendsmart_expense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT MUST match auth-service's jwt.secret exactly
jwt.secret=SpendSmartSecretKey2026_Standard32Bytes!

# budget-service URL for syncing category spent totals after expense changes
budget.service.url=http://localhost:8085

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

