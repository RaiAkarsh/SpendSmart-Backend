# ================================================================
#  expense-service  Port 8082
#  Handles: add/edit/delete expenses, filter, search, totals
# ================================================================

server.port=${PORT:8082}
spring.application.name=expense-service

# ── Eureka Service Discovery ────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# ── Datasource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendsmart_expense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT MUST match auth-service's jwt.secret exactly
jwt.secret=${JWT_SECRET:SpendSmartSecretKey2026_Standard32Bytes!}

# budget-service URL for syncing category spent totals after expense changes.
# Calls are wrapped in try/catch; if budget-service is not deployed the
# expense flow still succeeds (sync is silently skipped).
budget.service.url=${BUDGET_SERVICE_URL:http://localhost:8085}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

