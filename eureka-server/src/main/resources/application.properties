# ================================================================
#  eureka-server  Port 8761 (default Eureka port)
#  Service Discovery Server for all SpendSmart microservices
# ================================================================

server.port=${PORT:8761}
spring.application.name=eureka-server

# Standalone mode: don't register itself as a client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# When deployed (e.g. Render) advertise the public hostname so other services
# can register/reach this server. Local dev keeps the default 'localhost'.
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}

# Dashboard
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
