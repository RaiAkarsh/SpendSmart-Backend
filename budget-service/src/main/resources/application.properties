# ================================================================
#  budget-service Port 8085
#  Handles: create budgets, track spentAmount, alerts, progress
# ================================================================

server.port=8085
spring.application.name=budget-service

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CHANGE: use your MySQL password
spring.datasource.url=jdbc:mysql://localhost:3306/spendsmart_budget?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URLs of other services this service calls
expense.service.url=http://localhost:8082

# JWT  MUST match auth-service's jwt.secret exactly
jwt.secret=SpendSmartSecretKey2026_Standard32Bytes!


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.template.mandatory=false

spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.data.redis.host=localhost
spring.data.redis.port=6379
