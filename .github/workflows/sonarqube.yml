name: Backend SonarCloud

on:
  push:
    branches:
      - main
      - master
      - feature/gateway-service
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run backend tests
        shell: bash
        run: |
          services=(
            "auth-service"
            "expense-service"
            "income-service"
            "category-service"
            "budget-service"
            "recurring-service"
            "analytics-service"
            "notification-service"
            "gateway-service"
            "eureka-server"
          )

          for service in "${services[@]}"; do
            echo "Running tests for $service"
            mvn -f "$service/pom.xml" clean test -Dtest='!*ApplicationTests'
          done

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
