server.port=${PORT:8081}
spring.application.name=auth-service

# ── Eureka Service Discovery ────────────────────────────────────────────────
# Local dev keeps localhost defaults. Render injects EUREKA_URL and
# RENDER_EXTERNAL_HOSTNAME so the service registers with its public hostname.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# ── Datasource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendsmart_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:SpendSmartSecretKey2026_Standard32Bytes!}
jwt.expiration=${JWT_EXPIRATION:86400000}
google.oauth.client-id=${GOOGLE_CLIENT_ID:992955080336-bmts5mu987s33p12hnnidldai5pc23hu.apps.googleusercontent.com}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
