# ================================================================
#  analytics-service Port 8086
#  Handles: monthly summaries, category breakdowns, income vs expense,
#           savings rate, spending trends, financial health score
#
#  NO database this service reads from expense-service and
#  income-service via Feign clients.
# ================================================================

server.port=8086
spring.application.name=analytics-service

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# URLs of other services this service calls
expense.service.url=http://localhost:8082
income.service.url=http://localhost:8083
budget.service.url=http://localhost:8085

# JWT MUST match auth-service's jwt.secret exactly
jwt.secret=SpendSmartSecretKey2026_Standard32Bytes!

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

spring.cache.type=redis
spring.cache.redis.time-to-live=2m
spring.data.redis.host=localhost
spring.data.redis.port=6379
