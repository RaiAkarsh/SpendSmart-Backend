# ================================================================
#  notification-service Port 8088
#  Handles: budget alerts, recurring reminders, monthly reports,
#           notification CRUD, mark as read
# ================================================================

server.port=8088
spring.application.name=notification-service

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CHANGE THIS: use your MySQL password
spring.datasource.url=jdbc:mysql://localhost:3306/spendsmart_notification?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URLs of other services this service calls
budget.service.url=http://localhost:8085
expense.service.url=http://localhost:8082
income.service.url=http://localhost:8083
analytics.service.url=http://localhost:8086

# JWT  -  MUST match auth-service's jwt.secret exactly
jwt.secret=SpendSmartSecretKey2026_Standard32Bytes!

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.missing-queues-fatal=true
spring.rabbitmq.listener.simple.auto-startup=true
