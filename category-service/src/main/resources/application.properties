server.port=${PORT:8084}
spring.application.name=category-service

# ── Eureka Service Discovery ────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# ── Datasource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendsmart_category?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT  -  MUST match auth-service's jwt.secret exactly
jwt.secret=${JWT_SECRET:SpendSmartSecretKey2026_Standard32Bytes!}
# budget-service may not be deployed in the trimmed 5-service mode; calls are
# wrapped in try/catch in the service layer so a missing budget service does
# not break category CRUD.
budget.service.url=${BUDGET_SERVICE_URL:http://localhost:8085}

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── Cache ───────────────────────────────────────────────────────────────────
# Default to in-memory cache (no external Redis required). Set CACHE_TYPE=redis
# locally to use the Redis instance for parity with production behaviour.
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=10m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
